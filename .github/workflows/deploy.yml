# Publie la webapp sur GitHub Pages à chaque push sur main.
# Prérequis (une fois) : Settings → Pages → Source : "GitHub Actions".
name: Déployer la webapp

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

# Par défaut, lecture seule : seule la tâche de publication reçoit le droit d'écrire sur Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

      # ── Aperçu de la branche v3-visuel, publié dans le sous-dossier /v3/ ──────────
      # Sert à tester la v3 sur iPhone sans toucher à la version en ligne. Un échec ici
      # n'empêche pas la publication de main. À retirer quand la branche sera fusionnée.
      # L'aperçu est figé sur un commit précis de la branche, pas sur la branche elle-même :
      # pour le rafraîchir, remplacer l'identifiant ci-dessous par celui du nouveau commit.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: 9e75e448238d5af128c35d4d65ad9cfa0f7b5e49
          path: preview
      - name: Construire l'aperçu v3
        continue-on-error: true
        working-directory: preview/web
        run: npm ci && npm run build -- --outDir ../../web/dist/v3 --emptyOutDir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
