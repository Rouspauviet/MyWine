# Publie la webapp sur GitHub Pages à chaque push sur main.
# Prérequis (une fois) : Settings → Pages → Source : "GitHub Actions".
name: Déployer la webapp

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

      # ── Aperçu de la branche v3-visuel, publié dans le sous-dossier /v3/ ──────────
      # Sert à tester la v3 sur iPhone sans toucher à la version en ligne. Un échec ici
      # n'empêche pas la publication de main. À retirer quand la branche sera fusionnée.
      # Pour rafraîchir l'aperçu après un push sur la branche : changer la ligne ci-dessous.
      # Aperçu : 9e75e44
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: v3-visuel
          path: preview
      - name: Construire l'aperçu v3
        continue-on-error: true
        working-directory: preview/web
        run: npm ci && npm run build -- --outDir ../../web/dist/v3 --emptyOutDir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
